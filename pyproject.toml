[project]
name = "zenalitics"
version = "0.1.0"
description = "analytics for zenmoney"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "fsspec>=2026.9.0",
    "pydantic>=2.14.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
